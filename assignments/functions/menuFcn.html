    <script>
        function greetUser(){
            console.log("Welcome to Student Tribe!");
            //when greetUser fcn runs it prints "Welcome to Student Tribe!"
        }
        
        function showMenu(str1){
            greetUser();
            return str1;
            //now showMenu fcn calls greetUser directly and returns str1
        }
        console.log(showMenu("Here is your course menu!"));

        //Here is your course menu! 
        // will be printed
    </script>
